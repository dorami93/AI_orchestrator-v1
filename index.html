<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Groq Chat</title>
<link rel="stylesheet" href="style.css">
</head>

<body>
<div id="messages"></div>

<form id="inputForm">
  <textarea id="input" placeholder="メッセージを入力..."></textarea>
  <button id="sendBtn">送信</button>
</form>

<div id="settingsModal" class="modal hidden">
  <div class="modalBox">
    <input id="apiKeyInput" type="password" placeholder="Groq API Key">
    <select id="modelInput"></select>
    <input id="temperatureInput" type="number" min="0" max="2" step="0.1" value="0">
    <input id="tokensInput" type="number" min="1" value="2000">
    <input id="jsonInput" type="file" accept=".json">
    <button id="saveSettingsBtn">保存</button>
    <button id="closeSettingsBtn">閉じる</button>
  </div>
</div>

<button id="settingsBtn">設定</button>

<script src="https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js"></script>
<script>
async function boot() {
  const pyodide = await loadPyodide();

  for (const name of ["output.py", "call_llm.py", "main.py"]) {
    const res = await fetch(name);
    pyodide.FS.writeFile(name, await res.text());
  }

  await pyodide.runPythonAsync("import main");
}

boot();
</script>
</body>
</html>
